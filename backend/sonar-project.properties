# SonarCloud Project Configuration
sonar.projectKey=ArcaDH_arca-dh
sonar.organization=arcadh
sonar.host.url=https://sonarcloud.io

# Source and Test directories
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts

# Code Coverage Reports
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.config.*,coverage/**
sonar.coverage.exclusions=src/db/dbMock.ts,src/db/migrate.ts,src/swagger.ts

# Encoding
sonar.sourceEncoding=UTF-8
